<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOP ’TIL YOU DROP</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Noise text ── */
    :root { --noise-url: none; }
    .noise-text {
      background-image: var(--noise-url);
      background-size: 100vw 100vh;
      background-attachment: fixed;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Sleeping face ── */
    #face { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    #mouth { animation: snore 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @keyframes snore   { 0%, 100% { transform: scale(0.75, 0.6); } 50% { transform: scale(1.1, 1.25); } }
    #zzz { position: absolute; left: 60%; top: 0%; width: 26%; height: 18%; pointer-events: none; }
    .z {
      position: absolute; bottom: 0; left: 0;
      font-weight: 800; line-height: 1;
      font-size: clamp(1.4rem, 4.6vh, 3.4rem);
      opacity: 0;
      animation: zfloat 6s ease-in infinite;
    }
    .z:nth-child(1) { font-size: clamp(1.1rem, 3.6vh, 2.6rem); }
    .z:nth-child(2) { animation-delay: 2s; left: 18%; }
    .z:nth-child(3) { animation-delay: 4s; left: 36%; font-size: clamp(1.7rem, 6vh, 4.4rem); }
    @keyframes zfloat {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.7) rotate(-8deg); }
      15%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { opacity: 0; transform: translate(170%, -60%) scale(1.05) rotate(10deg); }
    }
    /* ── Machine sways gently as it sleeps, and hums faintly when on ── */
    #machine { animation: sway 5s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes sway {
      0%, 100% { transform: translateY(0) rotate(-0.8deg); }
      50%      { transform: translateY(-5px) rotate(0.8deg); }
    }
    #machine svg { transition: transform 0.3s; }
    #machine.on svg { animation: hum 0.18s linear infinite; }
    @keyframes hum {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(0.6px, -0.4px); }
      50% { transform: translate(-0.5px, 0.5px); }
      75% { transform: translate(0.4px, 0.3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #face, #mouth, .z, #machine, #machine.on svg { animation: none; }
      .z { opacity: 1; position: static; display: inline-block; margin-right: 0.2em; }
    }
    /* ── Splash ── */
    #splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease, background-color 2.5s ease;
      padding-bottom: 9rem;
    }
    #splash.settled { background-color: transparent; }
    #splash.settled #title, #splash.settled #subhead { opacity: 0 !important; transition: opacity 1.8s ease; }
    #machine-wrap { transition: transform 2.8s cubic-bezier(.45,0,.25,1); }
    /* each part of a headline line fades in on its own beat */
    #subhead .part { display: block; transition: opacity 0.9s ease; }
    #subhead .part.later { opacity: 0; }
    #subhead .brand { text-transform: none; }   /* "snoozAI" keeps its casing so the AI stands out */
    /* ── Sound machine ── */
    #machine {
      position: relative;
      width: min(100vw, calc(38vh * 1000 / 560), 1300px);
      aspect-ratio: 1000 / 560;
    }
    #machine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #title {
      margin-bottom: 2.5vh;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 0.93;
      /* font-size set by JS */
    }
    #machine-knob {
      position: absolute;
      left: 50%; top: 30.4%;
      width: 22%; aspect-ratio: 2.4 / 1;
      transform: translate(-50%, -50%);
      border: none; background: transparent; border-radius: 50%;
      cursor: pointer;
      pointer-events: all;
    }
    #machine-knob:focus-visible { outline: 2px solid rgba(0,0,0,0.5); outline-offset: 4px; }
    #led { fill: #c9c9c9; transition: fill 0.4s, filter 0.4s; }
    #machine.on #led { fill: #6fdc8c; filter: drop-shadow(0 0 6px #6fdc8c); }
    #knob-cap { transition: transform 0.15s; transform-origin: 500px 170px; }
    #machine-knob:active ~ svg #knob-cap { transform: scale(0.94); }
    #subhead {
      margin-top: 2.5vh;
      width: min(92vw, 1100px);
      height: 3.3em;               /* room for up to three lines, so nothing jumps */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: clamp(1.15rem, min(3.4vw, 4.2vh), 2.9rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    /* ── Scrolling feed ── */
    #feed {
      position: fixed; inset: 0; z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }
    .slop-item {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: 0;
      text-align: center;
      opacity: 0;
      will-change: transform, opacity, filter;
      animation: grain-drift 60s linear infinite;
    }
    .item-tag {
      display: block;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.4);
      -webkit-text-fill-color: rgba(0, 0, 0, 0.4);
      margin-bottom: 0.45rem;
    }
    /* ── The wall: an endless, faint, slowly scrolling wall of slop ── */
    #slop-wall {
      position: absolute; inset: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 4s ease;
      --fade: 86vh;   /* set by JS to just above the controls */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 calc(var(--fade) - 22vh), transparent var(--fade));
              mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 calc(var(--fade) - 22vh), transparent var(--fade));
    }
    #slop-wall.on { opacity: 0.5; }
    #slop-wall-inner {
      padding: 0 16px;
      font-size: clamp(0.95rem, 1.35vw, 1.35rem);
      font-weight: 600;
      line-height: 1.5;
      text-align: justify;
      will-change: transform;
      animation: grain-drift 60s linear infinite;
    }
    #slop-wall-inner p { margin-bottom: 0.9em; }
    /* the grain slides slowly instead of flickering */
    @keyframes grain-drift { from { background-position: 0 0; } to { background-position: 640px 360px; } }
    /* static rings that ripple out from under the machine as it digests slop */
    .static-ripple {
      position: absolute;
      background-image: var(--noise-url);
      background-size: 100vw 100vh;
      background-attachment: fixed;
      -webkit-mask-image: radial-gradient(ellipse closest-side, transparent 72%, #000 86%, transparent 100%);
              mask-image: radial-gradient(ellipse closest-side, transparent 72%, #000 86%, transparent 100%);
      opacity: 0;
      pointer-events: none;
    }

    /* ── Controls ── */
    #controls {
      position: fixed; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.65rem;
      pointer-events: none;
    }
    #noise-label, #noise-btn { white-space: nowrap; }
    #noise-label {
      font-size: 0.68rem;
      color: rgba(0, 0, 0, 0.28);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #noise-btn {
      background: rgba(0,0,0,0.04);
      border: 1.5px solid rgba(0,0,0,0.18);
      color: rgba(0,0,0,0.55);
      padding: 0.8rem 2.4rem;
      border-radius: 99px;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      pointer-events: all;
    }
    #noise-btn:hover { background: rgba(0,0,0,0.08); color: #000; }
    #noise-btn.on { color: #000; border-color: rgba(0,0,0,0.4); background: rgba(0,0,0,0.06); }
    #pause-btn {
      background: none; border: none;
      color: rgba(0,0,0,0.18);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s;
      pointer-events: all;
      padding: 0.2rem 0.4rem;
    }
    #pause-btn:hover { color: rgba(0,0,0,0.45); }
  </style>
</head>

      </g>

<div id="feed"><div id="slop-wall" aria-hidden="true"><div id="slop-wall-inner" class="noise-text"></div></div></div>

<script src="slop-generator.js"></script>
<script>
// ── Noise texture ─────────────────────────────────────────────────────────────
// A small pool of static frames is generated once. The page-wide texture (the
// scrolling slop) changes slowly; the headline flips through frames at TV-static
// speed, jumping the grain to a random offset each flip so it never repeats.
(function () {
  const NW = 640, NH = 360, FRAMES = 8;
  const nc = document.createElement('canvas');
  nc.width = NW; nc.height = NH;
  const nctx = nc.getContext('2d');
  const frames = [];
  for (let f = 0; f < FRAMES; f++) {
    const id = nctx.createImageData(NW, NH);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    nctx.putImageData(id, 0, 0);
    const url = `url('${nc.toDataURL()}')`;
    frames.push(url);
    new Image().src = url.slice(5, -2); // decode up front so flips are instant
  }
  const pick = prev => { let f; do { f = frames[Math.random() * FRAMES | 0]; } while (f === prev); return f; };

  // Page-wide texture (slop, Zs, ripples): a soft, low-contrast grain that
  // never flickers; movement comes from slowly sliding it instead.
  const small = document.createElement('canvas');
  small.width = NW / 2; small.height = NH / 2;
  const sctx = small.getContext('2d');
  const sid = sctx.createImageData(small.width, small.height);
  for (let i = 0; i < sid.data.length; i += 4) {
    const v = 95 + (Math.random() - 0.5) * 80 | 0;
    sid.data[i] = sid.data[i+1] = sid.data[i+2] = v;
    sid.data[i+3] = 255;
  }
  sctx.putImageData(sid, 0, 0);
  nctx.imageSmoothingEnabled = true;
  nctx.drawImage(small, 0, 0, NW, NH);
  document.documentElement.style.setProperty('--noise-url', `url('${nc.toDataURL()}')`);

  // Headline: fast TV static (gentler when the viewer prefers reduced motion)
  const title = document.getElementById('title');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FAST_MS = reduce ? 400 : 55;
  let fast = frames[1], last = 0;
  (function flicker(now) {
    if (title.closest('.settled')) return; // headline has faded away
    if (now - last >= FAST_MS) {
      last = now;
      fast = pick(fast);
      title.style.setProperty('--noise-url', fast);
      title.style.backgroundPosition = `${Math.random() * NW | 0}px ${Math.random() * NH | 0}px`;
    }
    requestAnimationFrame(flicker);
  })(0);
})();

// ── Fit title above the machine: one or two lines, whichever is bigger ──────
function fitTitle() {
  const box = document.getElementById('title');
  const tc = document.createElement('canvas').getContext('2d');
  const maxW = window.innerWidth * 0.95, maxH = window.innerHeight * 0.22;
  const fit = lines => {
    let size = 8;
    while (size < 1000) {
      const next = size + 2;
      tc.font = `800 ${next}px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif`;
      const w = Math.max(...lines.map(l => tc.measureText(l).width)) * 1.03;
      if (w > maxW || next * 0.95 * lines.length > maxH) break;
      size = next;
    }
    return size;
  };
  const one = fit(['SLOP ’TIL YOU DROP']), two = fit(['SLOP ’TIL', 'YOU DROP']);
  box.innerHTML = two > one ? 'SLOP&nbsp;’TIL<br>YOU&nbsp;DROP' : 'SLOP ’TIL YOU DROP';
  box.style.fontSize = Math.max(one, two) + 'px';
}
fitTitle();
window.addEventListener('resize', fitTitle);

// ── Splash + sequential subheads ──────────────────────────────────────────────
// Each line can have parts; later parts appear a beat after the first.
const SUBHEADS = [
  ["AI is already white noise.", "Might as well use it to fall asleep."],
  ["Let your new friend snoozAI bore you into algorithmic slumber."]
];
const BEAT_MS = 1500;
const splash  = document.getElementById('splash');
const subEl   = document.getElementById('subhead');

// Fade splash in
requestAnimationFrame(() => requestAnimationFrame(() => { splash.style.opacity = '1'; }));

function showSubhead(parts) {
  subEl.style.opacity = '0';
  setTimeout(() => {
    subEl.innerHTML = '';
    parts.forEach((text, i) => {
      const span = document.createElement('span');
      span.className = 'part noise-text' + (i ? ' later' : '');
      span.textContent = text;
      // the name keeps its casing, and the line breaks right after it
      span.innerHTML = span.innerHTML.replace(/snoozAI\s*/, '<span class="brand">snoozAI</span><br>');
      subEl.appendChild(span);
      if (i) setTimeout(() => span.classList.remove('later'), BEAT_MS * i);
    });
    subEl.style.opacity = '1';
  }, 800);
}

setTimeout(() => showSubhead(SUBHEADS[0]), 1200);
setTimeout(() => showSubhead(SUBHEADS[1]), 6200);

// After the three subheads, the headline fades and the sleeping machine
// glides to the middle of the screen, where it stays while the slop plays.
const machineWrap = document.getElementById('machine-wrap');
let machineDy = 0, machineScale = 1;
function centerMachine() {
  if (!splash.classList.contains('settled')) return;
  const r = machineWrap.getBoundingClientRect();
  const w0 = r.width / machineScale, h0 = r.height / machineScale;      // size before scaling
  const controlsTop = document.getElementById('controls').getBoundingClientRect().top;
  const top = window.innerHeight * 0.05, bottom = controlsTop - 20;
  // as big as fits: within the screen width, and (with room for the Zs above) above the controls
  machineScale = Math.max(1, Math.min(1.35, (window.innerWidth * 0.98) / w0, (bottom - top) / (h0 * 1.3)));
  const target = (top + bottom) / 2 + h0 * machineScale * 0.12;        // nudge down to leave room for the Zs
  machineDy += target - (r.top + r.height / 2);
  machineWrap.style.transform = `translateY(${machineDy}px) scale(${machineScale})`;
  document.getElementById('slop-wall').style.setProperty('--fade', (controlsTop - 24) + 'px');
}
setTimeout(() => {
  splash.classList.add('settled');
  centerMachine();
}, 11800);
window.addEventListener('resize', () => requestAnimationFrame(centerMachine));

// ── Slop supply ───────────────────────────────────────────────────────────────
// All LinkedIn slop: mostly freshly generated (slop-generator.js, built on the
// Bot Leadership corpus), mixed with hand-written LinkedIn posts from data/slop.json.
let fallback  = [];
let fallbackIdx = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextItem() {
  if (fallback.length && Math.random() < 0.15) {
    if (fallbackIdx >= fallback.length) { fallback = shuffle(fallback); fallbackIdx = 0; }
    return fallback[fallbackIdx++];
  }
  return makeSlop();
}

// only the hand-written pieces that are LinkedIn posts
const LINKEDIN_TAGS = ['LINKEDIN POST', 'THOUGHT LEADERSHIP', 'MOTIVATIONAL CAROUSEL', 'PRODUCT LAUNCH'];
fetch('data/slop.json').then(r => r.json())
  .then(data => { fallback = shuffle(data.filter(d => LINKEDIN_TAGS.includes(d.tag))); }).catch(() => {});

// ── Feed ──────────────────────────────────────────────────────────────────────
const feed     = document.getElementById('feed');
let paused     = false;
const pauseBtn = document.getElementById('pause-btn');

const machineEl = document.getElementById('machine');

// Where slop goes in: the top of the machine, by the knob and vents
function intakePoint() {
  const r = machineEl.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height * 0.32, r };
}

function staticRipple() {
  const { r } = intakePoint();
  const el = document.createElement('div');
  el.className = 'static-ripple';
  const w = r.width * 1.05, h = r.height * 0.55;
  el.style.cssText = `left:${r.left + r.width / 2 - w / 2}px;top:${r.top + r.height * 0.78 - h / 2}px;width:${w}px;height:${h}px`;
  feed.appendChild(el);
  el.animate(
    [{ transform: 'scale(0.9)', opacity: 0 }, { opacity: 0.55, offset: 0.2 }, { transform: 'scale(1.9)', opacity: 0 }],
    { duration: 6500, easing: 'cubic-bezier(.2,.6,.3,1)' }
  ).onfinish = () => el.remove();
}

function spawnItem() {
  const item = nextItem();
  const el   = document.createElement('div');
  el.className = 'slop-item noise-text';
  el.innerHTML = `<span class="item-tag">${item.tag}</span>${item.text.replace(/\n/g, '<br>')}`;

  const vw = window.innerWidth, vh = window.innerHeight;
  const shrink = Math.min(1, Math.max(0.62, vw / 1100));
  const fsize = Math.min(2.6, Math.max(1.35, 3.0 - item.text.length / 110)) * shrink;
  const lines = item.text.split('\n');

  // Free space around the machine: left, right, above and below it (above the controls)
  const m = machineEl.getBoundingClientRect();
  const body = { left: m.left + m.width * 0.06, right: m.right - m.width * 0.06,
                 top: m.top + m.height * 0.14, bottom: m.top + m.height * 0.92 };   // the drawn machine, not its box
  const floor = document.getElementById('controls').getBoundingClientRect().top - 18;
  const regions = [
    { x0: 12, x1: body.left - 12, y0: 14, y1: floor },
    { x0: body.right + 12, x1: vw - 12, y0: 14, y1: floor },
    { x0: 12, x1: vw - 12, y0: 14, y1: body.top - 8 },
    { x0: 12, x1: vw - 12, y0: body.bottom + 8, y1: floor },
  ].filter(r => r.x1 - r.x0 >= 190 && r.y1 - r.y0 >= 90);
  if (!regions.length) return;
  const others = [...feed.querySelectorAll('.slop-item')].map(o => o.getBoundingClientRect());

  feed.appendChild(el);
  let x, y, placed = false;
  for (let tries = 0; tries < 10 && !placed; tries++) {
    // bigger spaces get picked more often
    const total = regions.reduce((t, r) => t + (r.x1 - r.x0) * (r.y1 - r.y0), 0);
    let roll = Math.random() * total, reg = regions[0];
    for (const r of regions) { roll -= (r.x1 - r.x0) * (r.y1 - r.y0); if (roll <= 0) { reg = r; break; } }
    const w = Math.min(560, reg.x1 - reg.x0, Math.max(200, vw * 0.4));
    const maxH = Math.min(reg.y1 - reg.y0, vh * (vw < 700 ? 0.26 : 0.36));
    el.style.cssText = `left:0;top:0;width:${w}px;font-size:${fsize}rem`;
    el.innerHTML = `<span class="item-tag">${item.tag}</span>${lines.join('<br>')}`;
    // long posts get cut off LinkedIn-style so they fit the space: "…see more"
    for (let keep = lines.length - 1; el.offsetHeight > maxH && keep >= 1; keep--) {
      el.innerHTML = `<span class="item-tag">${item.tag}</span>${lines.slice(0, keep).join('<br>')}<br>…see more`;
    }
    const h = el.offsetHeight;
    if (h > reg.y1 - reg.y0) continue;
    x = reg.x0 + w / 2 + Math.random() * (reg.x1 - reg.x0 - w);
    y = reg.y0 + h / 2 + Math.random() * (reg.y1 - reg.y0 - h);
    placed = !others.some(r => {     // other slop may overlap a little, not a lot
      const ix = Math.min(x + w / 2, r.right) - Math.max(x - w / 2, r.left);
      const iy = Math.min(y + h / 2, r.bottom) - Math.max(y - h / 2, r.top);
      return ix > 0 && iy > 0 && ix * iy > 0.1 * Math.min(w * h, r.width * r.height);
    });
  }
  if (!placed) { el.remove(); return; }   // no room right now; try again next time
  el.style.left = x + 'px'; el.style.top = y + 'px';

  const { x: tx, y: ty } = intakePoint();
  const dx = tx - x, dy = ty - y;
  const dur = 14000 + Math.random() * 6000;
  const anim = el.animate([
    { transform: 'translate(-50%, -50%) scale(1)', opacity: 0, filter: 'blur(2px)' },
    { opacity: 1, filter: 'blur(0px)', offset: 0.18 },
    { opacity: 0.9, offset: 0.75 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.1)`, opacity: 0, filter: 'blur(3px)' }
  ], { duration: dur, easing: 'cubic-bezier(.4,0,.7,1)', fill: 'forwards' });
  if (paused) anim.pause();
  anim.onfinish = () => {      // swallowed: it becomes part of the noise
    el.remove();
    queueForAudio(item);
    staticRipple();
  };
}

function togglePause() {
  paused = !paused;
  feed.getAnimations({ subtree: true }).forEach(a => paused ? a.pause() : a.play());
  pauseBtn.innerHTML = paused ? '&#9654;&nbsp;resume' : '&#9646;&#9646;&nbsp;pause';
}

// ── The wall: endless AI slop scrolling slowly upward behind everything ──────
const wall      = document.getElementById('slop-wall');
const wallInner = document.getElementById('slop-wall-inner');
let wallY = 0, wallLast = 0;
function fillWall() {
  while (wallInner.offsetHeight + wallY < window.innerHeight * 2) {
    const para = document.createElement('p');
    para.textContent = makeSlopParagraph();
    wallInner.appendChild(para);
  }
}
function scrollWall(now) {
  const dt = Math.min(100, now - (wallLast || now)); wallLast = now;
  if (!paused && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) wallY -= dt * 0.014; // ~14px a second
  const first = wallInner.firstElementChild;
  if (first && first.offsetHeight + wallY < 0) {   // scrolled off the top: recycle it
    wallY += first.offsetHeight + parseFloat(getComputedStyle(first).marginBottom);
    first.remove();
  }
  fillWall();
  wallInner.style.transform = `translateY(${wallY}px)`;
  requestAnimationFrame(scrollWall);
}

// Once the machine settles, the wall fades up and slop starts pouring in
setTimeout(() => {
  fillWall();
  wall.classList.add('on');
  requestAnimationFrame(scrollWall);
  for (let i = 0; i < 8; i++) setTimeout(() => { if (!paused) spawnItem(); }, i * 450);
  setTimeout(function scheduleSpawn() {
    if (!paused) spawnItem();
    // a little less on smaller screens
    const roomy = Math.min(1, Math.sqrt(window.innerWidth * window.innerHeight / (1440 * 900)));
    setTimeout(scheduleSpawn, (900 + Math.random() * 700) / Math.max(0.55, roomy));
  }, 3600);
}, 12200);

// ── Slop noise audio ──────────────────────────────────────────────────────────
// Every piece of slop that passes through the feed is turned into noise: its
// characters seed and continually re-scramble the random samples, which are
// then shaped into a soft pink "fan" hum at a constant level. Chunks overlap
// with equal-power crossfades, so the result is one steady, unbroken hum that
// keeps feeding itself from the live slop.
let audioCtx = null, masterGain = null, filterNode = null, noiseOn = false;
let nextChunkAt = 0, schedulerId = null;
const audioQueue = [];
const CHUNK_SEC = 8, FADE_SEC = 3;
const FADE_IN  = new Float32Array(256).map((_, i) => Math.sin((i / 255) * Math.PI / 2));
const FADE_OUT = new Float32Array(256).map((_, i) => Math.cos((i / 255) * Math.PI / 2));

function queueForAudio(item) {
  audioQueue.push(item);
  if (audioQueue.length > 30) audioQueue.shift();
}

function hashText(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0 || 1;
}

function slopToBuffer(ctx, text) {
  const n   = Math.floor(ctx.sampleRate * CHUNK_SEC);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d   = buf.getChannelData(0);
  const len = text.length;
  let state = hashText(text);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < n; i++) {
    // xorshift PRNG, re-scrambled by the slop's characters as it goes
    state ^= state << 13; state ^= state >>> 17; state ^= state << 5;
    state = (state ^ Math.imul(text.charCodeAt(i % len), 2654435761)) >>> 0;
    const w = (state / 4294967296) * 2 - 1;
    // pink-noise filter (Paul Kellet): the deeper, softer hiss of a sound machine
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
    b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
    b6 = w * 0.115926;
  }
  return buf;
}

function scheduleChunk(ctx, dest, t, item) {
  const src = ctx.createBufferSource();
  src.buffer = slopToBuffer(ctx, item.text || '···');
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.setValueCurveAtTime(FADE_IN, t, FADE_SEC);
  g.gain.setValueCurveAtTime(FADE_OUT, t + CHUNK_SEC - FADE_SEC, FADE_SEC);
  src.connect(g); g.connect(dest);
  src.start(t); src.stop(t + CHUNK_SEC);
  return t + CHUNK_SEC - FADE_SEC;
}

function scheduleChunks() {
  // keep two chunks queued ahead so the hum never gaps
  while (nextChunkAt < audioCtx.currentTime + CHUNK_SEC * 2) {
    const item = audioQueue.shift() || nextItem();
    const t = Math.max(nextChunkAt, audioCtx.currentTime + 0.05);
    nextChunkAt = scheduleChunk(audioCtx, filterNode, t, item);
  }
}

// ── Play through the silent switch on phones ─────────────────────────────────
// iPhones mute web audio when the ringer is on silent, because by default it
// counts as "ambient" sound. Two fixes, both started from the button tap:
//  1. Safari 16.4+: declare this page as media playback (ignores the silent switch).
//  2. Older iPhones: loop a tiny silent <audio> track, which switches the phone
//     into media playback for the page, so the slop hum is heard too.
let silentKeepAlive = null;
function silentWav() {
  // 0.5s of 8-bit mono silence at 8 kHz, as a WAV data URI
  const rate = 8000, n = rate / 2, buf = new Uint8Array(44 + n);
  const dv = new DataView(buf.buffer);
  const str = (o, t) => [...t].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
  str(0, 'RIFF'); dv.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  str(36, 'data'); dv.setUint32(40, n, true); buf.fill(128, 44);
  let bin = ''; buf.forEach(b => bin += String.fromCharCode(b));
  return 'data:audio/wav;base64,' + btoa(bin);
}
function playThroughSilentSwitch() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  if (!silentKeepAlive) {
    silentKeepAlive = new Audio(silentWav());
    silentKeepAlive.loop = true;
    silentKeepAlive.setAttribute('playsinline', '');
    silentKeepAlive.setAttribute('x-webkit-airplay', 'deny');
  }
  silentKeepAlive.play().catch(() => {});
}
// iOS can pause the audio after a call, Siri or switching apps; pick it back up
function resumeIfNeeded() {
  if (noiseOn && audioCtx && audioCtx.state !== 'running') {
    audioCtx.resume().catch(() => {});
    if (silentKeepAlive && silentKeepAlive.paused) silentKeepAlive.play().catch(() => {});
  }
}
document.addEventListener('visibilitychange', resumeIfNeeded);
window.addEventListener('pageshow', resumeIfNeeded);

function toggleNoise() {
  const btn = document.getElementById('noise-btn');
  if (!noiseOn) {
    playThroughSilentSwitch();   // must happen inside the tap, before the audio starts
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass'; filterNode.frequency.value = 2200;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      filterNode.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      audioCtx.onstatechange = resumeIfNeeded;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 2);
    nextChunkAt = audioCtx.currentTime;
    scheduleChunks();
    schedulerId = setInterval(scheduleChunks, 500);
    noiseOn = true;
    document.getElementById('machine')?.classList.add('on');
    btn.classList.add('on');
    btn.innerHTML = '&#9646;&#9646;&nbsp;&nbsp;slop noise';
  } else {
    noiseOn = false;
    if (silentKeepAlive) silentKeepAlive.pause();
    document.getElementById('machine')?.classList.remove('on');
    clearInterval(schedulerId);
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
    btn.classList.remove('on');
    btn.innerHTML = '&#9654;&nbsp;&nbsp;slop noise';
  }
}
</script>
</body>
