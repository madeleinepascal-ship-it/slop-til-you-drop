<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOP TIL YOU DROP</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Noise text ── */
    :root { --noise-url: none; }
    .noise-text {
      background-image: var(--noise-url);
      background-size: 100vw 100vh;
      background-attachment: fixed;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Sleeping face ── */
    #face { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    #mouth { animation: snore 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @keyframes snore   { 0%, 100% { transform: scale(0.75, 0.6); } 50% { transform: scale(1.1, 1.25); } }
    #zzz { position: absolute; left: 60%; top: -6%; width: 26%; height: 22%; pointer-events: none; }
    .z {
      position: absolute; bottom: 0; left: 0;
      font-weight: 800; line-height: 1;
      font-size: clamp(1.4rem, 4.6vh, 3.4rem);
      opacity: 0;
      animation: zfloat 6s ease-in infinite;
    }
    .z:nth-child(1) { font-size: clamp(1.1rem, 3.6vh, 2.6rem); }
    .z:nth-child(2) { animation-delay: 2s; left: 18%; }
    .z:nth-child(3) { animation-delay: 4s; left: 36%; font-size: clamp(1.7rem, 6vh, 4.4rem); }
    @keyframes zfloat {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.7) rotate(-8deg); }
      15%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { opacity: 0; transform: translate(170%, -95%) scale(1.1) rotate(10deg); }
    }
    /* ── Machine sways gently as it sleeps, and hums faintly when on ── */
    #machine { animation: sway 5s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes sway {
      0%, 100% { transform: translateY(0) rotate(-0.8deg); }
      50%      { transform: translateY(-5px) rotate(0.8deg); }
    }
    #machine svg { transition: transform 0.3s; }
    #machine.on svg { animation: hum 0.18s linear infinite; }
    @keyframes hum {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(0.6px, -0.4px); }
      50% { transform: translate(-0.5px, 0.5px); }
      75% { transform: translate(0.4px, 0.3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #face, #mouth, .z, #machine, #machine.on svg { animation: none; }
      .z { opacity: 1; position: static; display: inline-block; margin-right: 0.2em; }
    }
    /* ── Splash ── */
    #splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease, background-color 2.5s ease;
      padding-bottom: 9rem;
    }
    #splash.settled { background-color: transparent; }
    #splash.settled #title, #splash.settled #subhead { opacity: 0 !important; transition: opacity 1.8s ease; }
    #machine-wrap { transition: transform 2.8s cubic-bezier(.45,0,.25,1); }
    /* ── Sound machine ── */
    #machine {
      position: relative;
      width: min(90vw, calc(34vh * 1000 / 560), 950px);
      aspect-ratio: 1000 / 560;
    }
    #machine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #title {
      margin-bottom: 5vh;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 0.93;
      /* font-size set by JS */
    }
    #machine-knob {
      position: absolute;
      left: 50%; top: 30.4%;
      width: 22%; aspect-ratio: 2.4 / 1;
      transform: translate(-50%, -50%);
      border: none; background: transparent; border-radius: 50%;
      cursor: pointer;
      pointer-events: all;
    }
    #machine-knob:focus-visible { outline: 2px solid rgba(0,0,0,0.5); outline-offset: 4px; }
    #led { fill: #c9c9c9; transition: fill 0.4s, filter 0.4s; }
    #machine.on #led { fill: #6fdc8c; filter: drop-shadow(0 0 6px #6fdc8c); }
    #knob-cap { transition: transform 0.15s; transform-origin: 500px 170px; }
    #machine-knob:active ~ svg #knob-cap { transform: scale(0.94); }
    #subhead {
      margin-top: 1.8rem;
      font-size: clamp(0.85rem, 1.8vw, 1.2rem);
      color: rgba(0, 0, 0, 0.38);
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.8s ease;
      min-height: 1.6em;
    }

    /* ── Scrolling feed ── */
    #feed {
      position: fixed; inset: 0; z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }
    .slop-item {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: 0;
      text-align: center;
      opacity: 0;
      will-change: transform, opacity, filter;
      animation: grain-drift 60s linear infinite;
    }
    .item-tag {
      display: block;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.18);
      -webkit-text-fill-color: rgba(0, 0, 0, 0.18);
      margin-bottom: 0.45rem;
    }
    /* the grain slides slowly instead of flickering */
    @keyframes grain-drift { from { background-position: 0 0; } to { background-position: 640px 360px; } }
    /* static rings that ripple out from under the machine as it digests slop */
    .static-ripple {
      position: absolute;
      background-image: var(--noise-url);
      background-size: 100vw 100vh;
      background-attachment: fixed;
      -webkit-mask-image: radial-gradient(ellipse closest-side, transparent 72%, #000 86%, transparent 100%);
              mask-image: radial-gradient(ellipse closest-side, transparent 72%, #000 86%, transparent 100%);
      opacity: 0;
      pointer-events: none;
    }

    /* ── Controls ── */
    #controls {
      position: fixed; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.65rem;
      pointer-events: none;
    }
    #noise-label, #noise-btn { white-space: nowrap; }
    #noise-label {
      font-size: 0.68rem;
      color: rgba(0, 0, 0, 0.28);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #noise-btn {
      background: rgba(0,0,0,0.04);
      border: 1.5px solid rgba(0,0,0,0.18);
      color: rgba(0,0,0,0.55);
      padding: 0.8rem 2.4rem;
      border-radius: 99px;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      pointer-events: all;
    }
    #noise-btn:hover { background: rgba(0,0,0,0.08); color: #000; }
    #noise-btn.on { color: #000; border-color: rgba(0,0,0,0.4); background: rgba(0,0,0,0.06); }
    #pause-btn {
      background: none; border: none;
      color: rgba(0,0,0,0.18);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s;
      pointer-events: all;
      padding: 0.2rem 0.4rem;
    }
    #pause-btn:hover { color: rgba(0,0,0,0.45); }
  </style>
</head>

      </g>
      <g id="face-pos" transform="translate(0 -14)">

<script>
// ── Noise texture ─────────────────────────────────────────────────────────────
// A small pool of static frames is generated once. The page-wide texture (the
// scrolling slop) changes slowly; the headline flips through frames at TV-static
// speed, jumping the grain to a random offset each flip so it never repeats.
(function () {
  const NW = 640, NH = 360, FRAMES = 8;
  const nc = document.createElement('canvas');
  nc.width = NW; nc.height = NH;
  const nctx = nc.getContext('2d');
  const frames = [];
  for (let f = 0; f < FRAMES; f++) {
    const id = nctx.createImageData(NW, NH);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    nctx.putImageData(id, 0, 0);
    const url = `url('${nc.toDataURL()}')`;
    frames.push(url);
    new Image().src = url.slice(5, -2); // decode up front so flips are instant
  }
  const pick = prev => { let f; do { f = frames[Math.random() * FRAMES | 0]; } while (f === prev); return f; };

  // Page-wide texture (slop, Zs, ripples): a soft, low-contrast grain that
  // never flickers; movement comes from slowly sliding it instead.
  const small = document.createElement('canvas');
  small.width = NW / 2; small.height = NH / 2;
  const sctx = small.getContext('2d');
  const sid = sctx.createImageData(small.width, small.height);
  for (let i = 0; i < sid.data.length; i += 4) {
    const v = 150 + (Math.random() - 0.5) * 110 | 0;
    sid.data[i] = sid.data[i+1] = sid.data[i+2] = v;
    sid.data[i+3] = 255;
  }
  sctx.putImageData(sid, 0, 0);
  nctx.imageSmoothingEnabled = true;
  nctx.drawImage(small, 0, 0, NW, NH);
  document.documentElement.style.setProperty('--noise-url', `url('${nc.toDataURL()}')`);

  // Headline: fast TV static (gentler when the viewer prefers reduced motion)
  const title = document.getElementById('title');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FAST_MS = reduce ? 400 : 55;
  let fast = frames[1], last = 0;
  (function flicker(now) {
    if (title.closest('.settled')) return; // headline has faded away
    if (now - last >= FAST_MS) {
      last = now;
      fast = pick(fast);
      title.style.setProperty('--noise-url', fast);
      title.style.backgroundPosition = `${Math.random() * NW | 0}px ${Math.random() * NH | 0}px`;
    }
    requestAnimationFrame(flicker);
  })(0);
})();

// ── Fit title above the machine: one or two lines, whichever is bigger ──────
function fitTitle() {
  const box = document.getElementById('title');
  const tc = document.createElement('canvas').getContext('2d');
  const maxW = window.innerWidth * 0.95, maxH = window.innerHeight * 0.33;
  const fit = lines => {
    let size = 8;
    while (size < 1000) {
      const next = size + 2;
      tc.font = `800 ${next}px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif`;
      const w = Math.max(...lines.map(l => tc.measureText(l).width)) * 1.03;
      if (w > maxW || next * 0.95 * lines.length > maxH) break;
      size = next;
    }
    return size;
  };
  const one = fit(['SLOP TIL YOU DROP']), two = fit(['SLOP TIL', 'YOU DROP']);
  box.innerHTML = two > one ? 'SLOP&nbsp;TIL<br>YOU&nbsp;DROP' : 'SLOP TIL YOU DROP';
  box.style.fontSize = Math.max(one, two) + 'px';
}
fitTitle();
window.addEventListener('resize', fitTitle);

// ── Splash + sequential subheads ──────────────────────────────────────────────
const SUBHEADS = [
  "use all the boring for something useful,",
  "like drifting into an algorithmic slumber,",
  "after all you can't spell napping without AI"
];
const splash  = document.getElementById('splash');
const subEl   = document.getElementById('subhead');

// Fade splash in
requestAnimationFrame(() => requestAnimationFrame(() => { splash.style.opacity = '1'; }));

function showSubhead(text) {
  subEl.style.opacity = '0';
  setTimeout(() => { subEl.textContent = text; subEl.style.opacity = '1'; }, 800);
}

setTimeout(() => showSubhead(SUBHEADS[0]), 1200);
setTimeout(() => showSubhead(SUBHEADS[1]), 4200);
setTimeout(() => showSubhead(SUBHEADS[2]), 7200);

// After the three subheads, the headline fades and the sleeping machine
// glides to the middle of the screen, where it stays while the slop plays.
const machineWrap = document.getElementById('machine-wrap');
let machineDy = 0;
function centerMachine() {
  if (!splash.classList.contains('settled')) return;
  const r = machineWrap.getBoundingClientRect();
  const controlsTop = document.getElementById('controls').getBoundingClientRect().top;
  const target = Math.min(window.innerHeight / 2, controlsTop / 2 + 10);
  machineDy += target - (r.top + r.height / 2);
  machineWrap.style.transform = `translateY(${machineDy}px)`;
}
setTimeout(() => {
  splash.classList.add('settled');
  centerMachine();
}, 10200);
window.addEventListener('resize', () => requestAnimationFrame(centerMachine));

// ── API sources ───────────────────────────────────────────────────────────────
const SOURCES = [
  {
    fetch: async () => {
      const d = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary').then(r => r.json());
      const text = (d.extract || '').split('\n')[0].trim().slice(0, 380);
      return text.length > 40 ? [{ tag: 'WIKIPEDIA', text }] : [];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://opentdb.com/api.php?amount=6&encode=url3986').then(r => r.json());
      if (d.response_code !== 0) return [];
      return d.results.map(q => ({
        tag: decodeURIComponent(q.category),
        text: decodeURIComponent(q.question)
      }));
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://api.adviceslip.com/advice', { cache: 'no-cache' }).then(r => r.json());
      return [{ tag: 'ADVICE', text: d.slip.advice }];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://icanhazdadjoke.com/', { headers: { Accept: 'application/json' } }).then(r => r.json());
      return [{ tag: 'DAD JOKE', text: d.joke }];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en').then(r => r.json());
      return [{ tag: 'USELESS FACT', text: d.text }];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://www.reddit.com/r/Showerthoughts/hot.json?limit=25&raw_json=1').then(r => r.json());
      return d.data.children
        .filter(c => !c.data.stickied && c.data.title.length > 20)
        .slice(0, 10)
        .map(c => ({ tag: 'SHOWER THOUGHT', text: c.data.title }));
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://www.reddit.com/r/todayilearned/hot.json?limit=25&raw_json=1').then(r => r.json());
      return d.data.children
        .filter(c => !c.data.stickied)
        .slice(0, 8)
        .map(c => ({ tag: 'TODAY I LEARNED', text: c.data.title.replace(/^TIL\s+that?\s*/i, '') }));
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://www.reddit.com/r/AskReddit/hot.json?limit=25&raw_json=1').then(r => r.json());
      return d.data.children
        .filter(c => !c.data.stickied && c.data.title.length > 20)
        .slice(0, 8)
        .map(c => ({ tag: 'ASK REDDIT', text: c.data.title }));
    }
  },
  {
    fetch: async () => {
      const ids = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json').then(r => r.json());
      const picks = [...ids].sort(() => Math.random() - 0.5).slice(0, 6);
      const items = await Promise.all(
        picks.map(id => fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json()).catch(() => null))
      );
      return items.filter(i => i?.title).map(i => ({ tag: 'HACKER NEWS', text: i.title }));
    }
  }
];

// ── Queue ─────────────────────────────────────────────────────────────────────
let apiQueue  = [];
let fallback  = [];
let fallbackIdx = 0;
let fetching  = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function refill() {
  if (fetching || apiQueue.length > 10) return;
  fetching = true;
  const src = SOURCES[Math.floor(Math.random() * SOURCES.length)];
  try {
    const items = await src.fetch();
    apiQueue.push(...shuffle(items.filter(i => i.text?.trim().length > 10)));
  } catch (_) {}
  fetching = false;
}

function nextItem() {
  if (apiQueue.length < 6) refill();
  if (apiQueue.length > 0) return apiQueue.shift();
  if (fallbackIdx >= fallback.length) { fallback = shuffle(fallback); fallbackIdx = 0; }
  return fallback[fallbackIdx++] || { tag: '···', text: '···' };
}

// Pre-fetch aggressively while splash shows
for (let i = 0; i < 5; i++) {
  const src = SOURCES[Math.floor(Math.random() * SOURCES.length)];
  src.fetch()
    .then(items => apiQueue.push(...shuffle(items.filter(i => i.text?.trim().length > 10))))
    .catch(() => {});
}

fetch('data/slop.json').then(r => r.json()).then(data => { fallback = shuffle(data); });

// ── Feed ──────────────────────────────────────────────────────────────────────
const feed     = document.getElementById('feed');
let paused     = false;
const pauseBtn = document.getElementById('pause-btn');

const machineEl = document.getElementById('machine');

// Where slop goes in: the top of the machine, by the knob and vents
function intakePoint() {
  const r = machineEl.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height * 0.32, r };
}

function staticRipple() {
  const { r } = intakePoint();
  const el = document.createElement('div');
  el.className = 'static-ripple';
  const w = r.width * 1.05, h = r.height * 0.55;
  el.style.cssText = `left:${r.left + r.width / 2 - w / 2}px;top:${r.top + r.height * 0.78 - h / 2}px;width:${w}px;height:${h}px`;
  feed.appendChild(el);
  el.animate(
    [{ transform: 'scale(0.9)', opacity: 0 }, { opacity: 0.55, offset: 0.2 }, { transform: 'scale(1.9)', opacity: 0 }],
    { duration: 6500, easing: 'cubic-bezier(.2,.6,.3,1)' }
  ).onfinish = () => el.remove();
}

function spawnItem() {
  const item = nextItem();
  const el   = document.createElement('div');
  el.className = 'slop-item noise-text';
  el.innerHTML = `<span class="item-tag">${item.tag}</span>${item.text.replace(/\n/g, '<br>')}`;

  const vw = window.innerWidth, vh = window.innerHeight;
  const shrink = Math.min(1, Math.max(0.62, vw / 1100));
  const fsize = Math.min(2.2, Math.max(1.05, 2.6 - item.text.length / 110)) * shrink;
  const maxW  = Math.min(440, Math.max(150, vw * 0.3));
  el.style.cssText = `left:0;top:0;width:${maxW}px;font-size:${fsize}rem`;
  feed.appendChild(el);
  const h = el.offsetHeight;

  // start somewhere around the edges, fully on screen, above the controls,
  // and not on top of the machine or other slop
  const floor = document.getElementById('controls').getBoundingClientRect().top - 18;
  const avoid = [machineEl.getBoundingClientRect(), ...[...feed.querySelectorAll('.slop-item')]
    .filter(o => o !== el).map(o => o.getBoundingClientRect())];
  const overlaps = (x, y) => avoid.some(r =>
    x - maxW / 2 < r.right && x + maxW / 2 > r.left && y - h / 2 < r.bottom && y + h / 2 > r.top);
  let x, y;
  for (let tries = 0; tries < 14; tries++) {
    const a = Math.random() * Math.PI * 2;
    x = Math.min(vw - maxW / 2 - 12, Math.max(maxW / 2 + 12, vw / 2 + Math.cos(a) * vw * 0.4));
    y = Math.min(floor - h / 2, Math.max(h / 2 + 14, vh * 0.42 + Math.sin(a) * vh * 0.4));
    if (!overlaps(x, y)) break;
    if (tries === 13) { el.remove(); return; }   // no room right now; try again next time
  }
  el.style.left = x + 'px'; el.style.top = y + 'px';

  const { x: tx, y: ty } = intakePoint();
  const dx = tx - x, dy = ty - y;
  const dur = 17000 + Math.random() * 7000;
  const anim = el.animate([
    { transform: 'translate(-50%, -50%) scale(1)', opacity: 0, filter: 'blur(2px)' },
    { opacity: 0.75, filter: 'blur(0px)', offset: 0.18 },
    { opacity: 0.6, offset: 0.75 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.1)`, opacity: 0, filter: 'blur(3px)' }
  ], { duration: dur, easing: 'cubic-bezier(.4,0,.7,1)', fill: 'forwards' });
  if (paused) anim.pause();
  anim.onfinish = () => {      // swallowed: it becomes part of the noise
    el.remove();
    queueForAudio(item);
    staticRipple();
  };
}

function togglePause() {
  paused = !paused;
  feed.getAnimations({ subtree: true }).forEach(a => paused ? a.pause() : a.play());
  pauseBtn.innerHTML = paused ? '&#9654;&nbsp;resume' : '&#9646;&#9646;&nbsp;pause';
}

// Once the machine settles, slop starts drifting in: a few quickly, then a calm trickle
setTimeout(() => {
  for (let i = 0; i < 5; i++) setTimeout(() => { if (!paused) spawnItem(); }, i * 900);
  setTimeout(function scheduleSpawn() {
    if (!paused) spawnItem();
    // calmer trickle on smaller screens
    const roomy = Math.min(1, Math.sqrt(window.innerWidth * window.innerHeight / (1440 * 900)));
    setTimeout(scheduleSpawn, (2400 + Math.random() * 1600) / Math.max(0.55, roomy));
  }, 5000);
}, 10600);

// ── Slop noise audio ──────────────────────────────────────────────────────────
// Every piece of slop that passes through the feed is turned into noise: its
// characters seed and continually re-scramble the random samples, which are
// then shaped into a soft pink "fan" hum at a constant level. Chunks overlap
// with equal-power crossfades, so the result is one steady, unbroken hum that
// keeps feeding itself from the live slop.
let audioCtx = null, masterGain = null, filterNode = null, noiseOn = false;
let nextChunkAt = 0, schedulerId = null;
const audioQueue = [];
const CHUNK_SEC = 8, FADE_SEC = 3;
const FADE_IN  = new Float32Array(256).map((_, i) => Math.sin((i / 255) * Math.PI / 2));
const FADE_OUT = new Float32Array(256).map((_, i) => Math.cos((i / 255) * Math.PI / 2));

function queueForAudio(item) {
  audioQueue.push(item);
  if (audioQueue.length > 30) audioQueue.shift();
}

function hashText(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0 || 1;
}

function slopToBuffer(ctx, text) {
  const n   = Math.floor(ctx.sampleRate * CHUNK_SEC);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d   = buf.getChannelData(0);
  const len = text.length;
  let state = hashText(text);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < n; i++) {
    // xorshift PRNG, re-scrambled by the slop's characters as it goes
    state ^= state << 13; state ^= state >>> 17; state ^= state << 5;
    state = (state ^ Math.imul(text.charCodeAt(i % len), 2654435761)) >>> 0;
    const w = (state / 4294967296) * 2 - 1;
    // pink-noise filter (Paul Kellet): the deeper, softer hiss of a sound machine
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
    b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
    b6 = w * 0.115926;
  }
  return buf;
}

function scheduleChunk(ctx, dest, t, item) {
  const src = ctx.createBufferSource();
  src.buffer = slopToBuffer(ctx, item.text || '···');
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.setValueCurveAtTime(FADE_IN, t, FADE_SEC);
  g.gain.setValueCurveAtTime(FADE_OUT, t + CHUNK_SEC - FADE_SEC, FADE_SEC);
  src.connect(g); g.connect(dest);
  src.start(t); src.stop(t + CHUNK_SEC);
  return t + CHUNK_SEC - FADE_SEC;
}

function scheduleChunks() {
  // keep two chunks queued ahead so the hum never gaps
  while (nextChunkAt < audioCtx.currentTime + CHUNK_SEC * 2) {
    const item = audioQueue.shift() || nextItem();
    const t = Math.max(nextChunkAt, audioCtx.currentTime + 0.05);
    nextChunkAt = scheduleChunk(audioCtx, filterNode, t, item);
    setTimeout(() => {
      if (noiseOn) document.getElementById('noise-label').textContent = `now humming: ${item.tag}`;
    }, Math.max(0, (t + FADE_SEC - audioCtx.currentTime) * 1000));
  }
}

function toggleNoise() {
  const btn = document.getElementById('noise-btn');
  if (!noiseOn) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass'; filterNode.frequency.value = 2200;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      filterNode.connect(masterGain);
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 2);
    nextChunkAt = audioCtx.currentTime;
    scheduleChunks();
    schedulerId = setInterval(scheduleChunks, 500);
    noiseOn = true;
    document.getElementById('machine')?.classList.add('on');
    btn.classList.add('on');
    btn.innerHTML = '&#9646;&#9646;&nbsp;&nbsp;slop noise';
  } else {
    noiseOn = false;
    document.getElementById('machine')?.classList.remove('on');
    clearInterval(schedulerId);
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
    btn.classList.remove('on');
    btn.innerHTML = '&#9654;&nbsp;&nbsp;slop noise';
    document.getElementById('noise-label').textContent = 'turn the slop into white noise';
  }
}
</script>
