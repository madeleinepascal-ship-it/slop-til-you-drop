<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOP TIL YOU DROP</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Noise text ── */
    :root { --noise-url: none; }
    .noise-text {
      background-image: var(--noise-url);
      background-size: 100vw 100vh;
      background-attachment: fixed;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Splash ── */
    #splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
      padding-bottom: 9rem;
    }
    /* ── Sound machine ── */
    #machine {
      position: relative;
      width: min(90vw, calc(34vh * 1000 / 560), 950px);
      aspect-ratio: 1000 / 560;
    }
    #machine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #title {
      margin-bottom: 2vh;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 0.93;
      /* font-size set by JS */
    }
    #machine-knob {
      position: absolute;
      left: 50%; top: 30.4%;
      width: 22%; aspect-ratio: 2.4 / 1;
      transform: translate(-50%, -50%);
      border: none; background: transparent; border-radius: 50%;
      cursor: pointer;
      pointer-events: all;
    }
    #machine-knob:focus-visible { outline: 2px solid rgba(0,0,0,0.5); outline-offset: 4px; }
    #led { fill: #c9c9c9; transition: fill 0.4s, filter 0.4s; }
    #machine.on #led { fill: #6fdc8c; filter: drop-shadow(0 0 6px #6fdc8c); }
    #knob-cap { transition: transform 0.15s; transform-origin: 500px 170px; }
    #machine-knob:active ~ svg #knob-cap { transform: scale(0.94); }
    #subhead {
      margin-top: 1.8rem;
      font-size: clamp(0.85rem, 1.8vw, 1.2rem);
      color: rgba(0, 0, 0, 0.38);
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.8s ease;
      min-height: 1.6em;
    }

    /* ── Scrolling feed ── */
    #feed {
      position: fixed; inset: 0; z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }
    .slop-item {
      position: absolute;
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.01em;
      animation: riseUp var(--dur, 16s) linear forwards;
      will-change: transform, opacity;
    }
    .item-tag {
      display: block;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.22);
      margin-bottom: 0.5rem;
    }
    @keyframes riseUp {
      0%   { opacity: 0; transform: translateY(0); }
      6%   { opacity: 1; }
      88%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(calc(-100vh - 900px)); }
    }

    /* ── Controls ── */
    #controls {
      position: fixed; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.65rem;
      pointer-events: none;
    }
    #noise-label, #noise-btn { white-space: nowrap; }
    #noise-label {
      font-size: 0.68rem;
      color: rgba(0, 0, 0, 0.28);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #noise-btn {
      background: rgba(0,0,0,0.04);
      border: 1.5px solid rgba(0,0,0,0.18);
      color: rgba(0,0,0,0.55);
      padding: 0.8rem 2.4rem;
      border-radius: 99px;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      pointer-events: all;
    }
    #noise-btn:hover { background: rgba(0,0,0,0.08); color: #000; }
    #noise-btn.on { color: #000; border-color: rgba(0,0,0,0.4); background: rgba(0,0,0,0.06); }
    #pause-btn {
      background: none; border: none;
      color: rgba(0,0,0,0.18);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s;
      pointer-events: all;
      padding: 0.2rem 0.4rem;
    }
    #pause-btn:hover { color: rgba(0,0,0,0.45); }
  </style>
</head>
<body>

<div id="splash">
  <h1 id="title" class="noise-text">SLOP TIL YOU DROP</h1>
  <div id="machine">
    <button id="machine-knob" onclick="toggleNoise()" aria-label="Turn slop noise on or off"></button>
    <svg viewBox="0 0 1000 560" aria-hidden="true">
      <defs>
        <linearGradient id="body-shade" x1="0" x2="1">
          <stop offset="0" stop-color="#cfcfcf"/><stop offset="0.18" stop-color="#ececec"/>
          <stop offset="0.45" stop-color="#f8f8f8"/><stop offset="0.8" stop-color="#e6e6e6"/>
          <stop offset="1" stop-color="#c4c4c4"/>
        </linearGradient>
        <radialGradient id="cap-shade" cx="0.45" cy="0.35" r="0.75">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e2e2"/>
        </radialGradient>
        <radialGradient id="knob-shade" cx="0.4" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#fdfdfd"/><stop offset="1" stop-color="#d4d4d4"/>
        </radialGradient>
      </defs>
      <path d="M60 170 L60 420 A440 90 0 0 0 940 420 L940 170 Z" fill="url(#body-shade)" stroke="#bdbdbd" stroke-width="1.5"/>
      <g stroke="#6a6a6a" stroke-linecap="round" opacity="0.75">
        <line x1="69.6" y1="206.7" x2="69.6" y2="238.7" stroke-width="1.9"/><line x1="77.0" y1="212.8" x2="77.0" y2="244.8" stroke-width="2.5"/><line x1="86.5" y1="218.8" x2="86.5" y2="250.8" stroke-width="3.1"/><line x1="98.0" y1="224.6" x2="98.0" y2="256.6" stroke-width="3.7"/><line x1="111.5" y1="230.3" x2="111.5" y2="262.3" stroke-width="4.2"/><line x1="126.9" y1="235.7" x2="126.9" y2="267.7" stroke-width="4.8"/><line x1="144.0" y1="240.9" x2="144.0" y2="272.9" stroke-width="5.3"/><line x1="162.9" y1="245.9" x2="162.9" y2="277.9" stroke-width="5.8"/><line x1="183.5" y1="250.5" x2="183.5" y2="282.5" stroke-width="6.3"/><line x1="205.6" y1="254.9" x2="205.6" y2="286.9" stroke-width="6.7"/><line x1="229.1" y1="258.9" x2="229.1" y2="290.9" stroke-width="7.1"/><line x1="254.0" y1="262.6" x2="254.0" y2="294.6" stroke-width="7.5"/><line x1="280.0" y1="265.9" x2="280.0" y2="297.9" stroke-width="7.8"/><line x1="307.1" y1="268.9" x2="307.1" y2="300.9" stroke-width="8.1"/><line x1="335.2" y1="271.4" x2="335.2" y2="303.4" stroke-width="8.3"/><line x1="364.0" y1="273.6" x2="364.0" y2="305.6" stroke-width="8.6"/><line x1="393.6" y1="275.3" x2="393.6" y2="307.3" stroke-width="8.7"/><line x1="423.6" y1="276.6" x2="423.6" y2="308.6" stroke-width="8.9"/><line x1="454.0" y1="277.5" x2="454.0" y2="309.5" stroke-width="9.0"/><line x1="484.6" y1="277.9" x2="484.6" y2="309.9" stroke-width="9.0"/><line x1="515.4" y1="277.9" x2="515.4" y2="309.9" stroke-width="9.0"/><line x1="546.0" y1="277.5" x2="546.0" y2="309.5" stroke-width="9.0"/><line x1="576.4" y1="276.6" x2="576.4" y2="308.6" stroke-width="8.9"/><line x1="606.4" y1="275.3" x2="606.4" y2="307.3" stroke-width="8.7"/><line x1="636.0" y1="273.6" x2="636.0" y2="305.6" stroke-width="8.6"/><line x1="664.8" y1="271.4" x2="664.8" y2="303.4" stroke-width="8.3"/><line x1="692.9" y1="268.9" x2="692.9" y2="300.9" stroke-width="8.1"/><line x1="720.0" y1="265.9" x2="720.0" y2="297.9" stroke-width="7.8"/><line x1="746.0" y1="262.6" x2="746.0" y2="294.6" stroke-width="7.5"/><line x1="770.9" y1="258.9" x2="770.9" y2="290.9" stroke-width="7.1"/><line x1="794.4" y1="254.9" x2="794.4" y2="286.9" stroke-width="6.7"/><line x1="816.5" y1="250.5" x2="816.5" y2="282.5" stroke-width="6.3"/><line x1="837.1" y1="245.9" x2="837.1" y2="277.9" stroke-width="5.8"/><line x1="856.0" y1="240.9" x2="856.0" y2="272.9" stroke-width="5.3"/><line x1="873.1" y1="235.7" x2="873.1" y2="267.7" stroke-width="4.8"/><line x1="888.5" y1="230.3" x2="888.5" y2="262.3" stroke-width="4.2"/><line x1="902.0" y1="224.6" x2="902.0" y2="256.6" stroke-width="3.7"/><line x1="913.5" y1="218.8" x2="913.5" y2="250.8" stroke-width="3.1"/><line x1="923.0" y1="212.8" x2="923.0" y2="244.8" stroke-width="2.5"/><line x1="930.4" y1="206.7" x2="930.4" y2="238.7" stroke-width="1.9"/>
      </g>
      <ellipse cx="500" cy="170" rx="440" ry="90" fill="url(#cap-shade)" stroke="#bdbdbd" stroke-width="1.5"/>
      <ellipse cx="500" cy="170" rx="330" ry="66" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="2"/>
      <ellipse cx="500" cy="176" rx="80" ry="22" fill="rgba(0,0,0,0.10)"/>
      <g id="knob-cap">
        <ellipse cx="500" cy="170" rx="74" ry="20" fill="url(#knob-shade)" stroke="#c2c2c2" stroke-width="1.5"/>
      </g>
      <circle id="led" cx="610" cy="186" r="5"/>
      <path d="M60 420 A440 90 0 0 0 940 420" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="3"/>
    </svg>
  </div>
  <p id="subhead"></p>
</div>

<div id="feed"></div>

<div id="controls">
  <div id="noise-label">turn the slop into white noise</div>
  <button id="noise-btn" onclick="toggleNoise()">&#9654;&nbsp;&nbsp;slop noise</button>
  <button id="pause-btn" onclick="togglePause()">&#9646;&#9646;&nbsp;pause</button>
</div>

<script>
// ── Noise texture ─────────────────────────────────────────────────────────────
(function () {
  const NW = 640, NH = 360;
  const nc = document.createElement('canvas');
  nc.width = NW; nc.height = NH;
  const nctx = nc.getContext('2d');

  function tick() {
    const id = nctx.createImageData(NW, NH);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    nctx.putImageData(id, 0, 0);
    document.documentElement.style.setProperty('--noise-url', `url('${nc.toDataURL()}')`);
  }
  tick();
  setInterval(tick, 220);
})();

// ── Fit title above the machine: one or two lines, whichever is bigger ──────
function fitTitle() {
  const box = document.getElementById('title');
  const tc = document.createElement('canvas').getContext('2d');
  const maxW = window.innerWidth * 0.95, maxH = window.innerHeight * 0.36;
  const fit = lines => {
    let size = 8;
    while (size < 1000) {
      const next = size + 2;
      tc.font = `800 ${next}px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif`;
      const w = Math.max(...lines.map(l => tc.measureText(l).width)) * 1.03;
      if (w > maxW || next * 0.95 * lines.length > maxH) break;
      size = next;
    }
    return size;
  };
  const one = fit(['SLOP TIL YOU DROP']), two = fit(['SLOP TIL', 'YOU DROP']);
  box.innerHTML = two > one ? 'SLOP&nbsp;TIL<br>YOU&nbsp;DROP' : 'SLOP TIL YOU DROP';
  box.style.fontSize = Math.max(one, two) + 'px';
}
fitTitle();
window.addEventListener('resize', fitTitle);

// ── Splash + sequential subheads ──────────────────────────────────────────────
const SUBHEADS = [
  "use all the boring for something useful,",
  "like drifting into an algorithmic slumber,",
  "after all you can't spell napping without AI"
];
const splash  = document.getElementById('splash');
const subEl   = document.getElementById('subhead');

// Fade splash in
requestAnimationFrame(() => requestAnimationFrame(() => { splash.style.opacity = '1'; }));

function showSubhead(text) {
  subEl.style.opacity = '0';
  setTimeout(() => { subEl.textContent = text; subEl.style.opacity = '1'; }, 800);
}

setTimeout(() => showSubhead(SUBHEADS[0]), 1200);
setTimeout(() => showSubhead(SUBHEADS[1]), 4200);
setTimeout(() => showSubhead(SUBHEADS[2]), 7200);

// Fade splash out after all three shown
setTimeout(() => {
  splash.style.opacity = '0';
  setTimeout(() => splash.remove(), 1500);
}, 10200);

// ── API sources ───────────────────────────────────────────────────────────────
const SOURCES = [
  {
    fetch: async () => {
      const d = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary').then(r => r.json());
      const text = (d.extract || '').split('\n')[0].trim().slice(0, 380);
      return text.length > 40 ? [{ tag: 'WIKIPEDIA', text }] : [];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://opentdb.com/api.php?amount=6&encode=url3986').then(r => r.json());
      if (d.response_code !== 0) return [];
      return d.results.map(q => ({
        tag: decodeURIComponent(q.category),
        text: decodeURIComponent(q.question)
      }));
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://api.adviceslip.com/advice', { cache: 'no-cache' }).then(r => r.json());
      return [{ tag: 'ADVICE', text: d.slip.advice }];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://icanhazdadjoke.com/', { headers: { Accept: 'application/json' } }).then(r => r.json());
      return [{ tag: 'DAD JOKE', text: d.joke }];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en').then(r => r.json());
      return [{ tag: 'USELESS FACT', text: d.text }];
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://www.reddit.com/r/Showerthoughts/hot.json?limit=25&raw_json=1').then(r => r.json());
      return d.data.children
        .filter(c => !c.data.stickied && c.data.title.length > 20)
        .slice(0, 10)
        .map(c => ({ tag: 'SHOWER THOUGHT', text: c.data.title }));
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://www.reddit.com/r/todayilearned/hot.json?limit=25&raw_json=1').then(r => r.json());
      return d.data.children
        .filter(c => !c.data.stickied)
        .slice(0, 8)
        .map(c => ({ tag: 'TODAY I LEARNED', text: c.data.title.replace(/^TIL\s+that?\s*/i, '') }));
    }
  },
  {
    fetch: async () => {
      const d = await fetch('https://www.reddit.com/r/AskReddit/hot.json?limit=25&raw_json=1').then(r => r.json());
      return d.data.children
        .filter(c => !c.data.stickied && c.data.title.length > 20)
        .slice(0, 8)
        .map(c => ({ tag: 'ASK REDDIT', text: c.data.title }));
    }
  },
  {
    fetch: async () => {
      const ids = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json').then(r => r.json());
      const picks = [...ids].sort(() => Math.random() - 0.5).slice(0, 6);
      const items = await Promise.all(
        picks.map(id => fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json()).catch(() => null))
      );
      return items.filter(i => i?.title).map(i => ({ tag: 'HACKER NEWS', text: i.title }));
    }
  }
];

// ── Queue ─────────────────────────────────────────────────────────────────────
let apiQueue  = [];
let fallback  = [];
let fallbackIdx = 0;
let fetching  = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function refill() {
  if (fetching || apiQueue.length > 10) return;
  fetching = true;
  const src = SOURCES[Math.floor(Math.random() * SOURCES.length)];
  try {
    const items = await src.fetch();
    apiQueue.push(...shuffle(items.filter(i => i.text?.trim().length > 10)));
  } catch (_) {}
  fetching = false;
}

function nextItem() {
  if (apiQueue.length < 6) refill();
  if (apiQueue.length > 0) return apiQueue.shift();
  if (fallbackIdx >= fallback.length) { fallback = shuffle(fallback); fallbackIdx = 0; }
  return fallback[fallbackIdx++] || { tag: '···', text: '···' };
}

// Pre-fetch aggressively while splash shows
for (let i = 0; i < 5; i++) {
  const src = SOURCES[Math.floor(Math.random() * SOURCES.length)];
  src.fetch()
    .then(items => apiQueue.push(...shuffle(items.filter(i => i.text?.trim().length > 10))))
    .catch(() => {});
}

fetch('data/slop.json').then(r => r.json()).then(data => { fallback = shuffle(data); });

// ── Feed ──────────────────────────────────────────────────────────────────────
const feed     = document.getElementById('feed');
let paused     = false;
const pauseBtn = document.getElementById('pause-btn');

function spawnItem(startY) {
  const item = nextItem();
  const el   = document.createElement('div');
  el.className = 'slop-item noise-text';

  // Shorter text gets blown up closer to title scale; longer text shrinks to still fit/wrap.
  const fsize = Math.min(6.2, Math.max(1.6, 7.2 - item.text.length / 30)) + Math.random() * 0.4;
  const maxW  = window.innerWidth * (0.34 + Math.random() * 0.48);
  const x     = 10 + Math.random() * Math.max(0, window.innerWidth - maxW - 20);
  const y     = startY !== undefined ? startY : window.innerHeight + 10;
  const dur   = 11 + Math.random() * 9;

  el.style.cssText = `left:${x}px;top:${y}px;max-width:${maxW}px;font-size:${fsize}rem`;
  el.style.setProperty('--dur', dur + 's');
  if (paused) el.style.animationPlayState = 'paused';

  el.innerHTML = `<span class="item-tag">${item.tag}</span>${item.text.replace(/\n/g, '<br>')}`;
  feed.appendChild(el);
  queueForAudio(item);
  setTimeout(() => el.remove(), (dur + 0.5) * 1000);
}

function togglePause() {
  paused = !paused;
  feed.querySelectorAll('.slop-item').forEach(el => {
    el.style.animationPlayState = paused ? 'paused' : 'running';
  });
  pauseBtn.innerHTML = paused ? '&#9654;&nbsp;resume' : '&#9646;&#9646;&nbsp;pause';
}

// Start slop just as splash begins fading — burst fills whole screen, then steady stream
setTimeout(() => {
  // Initial burst spread across full viewport
  const INIT = 24;
  for (let i = 0; i < INIT; i++) {
    setTimeout(() => spawnItem(Math.random() * window.innerHeight * 1.1), i * 120);
  }

  // Fast ongoing stream from bottom
  let spawnDelay = INIT * 120 + 200;
  (function scheduleSpawn() {
    if (!paused) spawnItem();
    setTimeout(scheduleSpawn, 850 + Math.random() * 550);
  }());
}, 9700);

// ── Slop noise audio ──────────────────────────────────────────────────────────
// Every piece of slop that passes through the feed is turned into noise: its
// characters seed and continually re-scramble the random samples, which are
// then shaped into a soft pink "fan" hum at a constant level. Chunks overlap
// with equal-power crossfades, so the result is one steady, unbroken hum that
// keeps feeding itself from the live slop.
let audioCtx = null, masterGain = null, filterNode = null, noiseOn = false;
let nextChunkAt = 0, schedulerId = null;
const audioQueue = [];
const CHUNK_SEC = 8, FADE_SEC = 3;
const FADE_IN  = new Float32Array(256).map((_, i) => Math.sin((i / 255) * Math.PI / 2));
const FADE_OUT = new Float32Array(256).map((_, i) => Math.cos((i / 255) * Math.PI / 2));

function queueForAudio(item) {
  audioQueue.push(item);
  if (audioQueue.length > 30) audioQueue.shift();
}

function hashText(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0 || 1;
}

function slopToBuffer(ctx, text) {
  const n   = Math.floor(ctx.sampleRate * CHUNK_SEC);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d   = buf.getChannelData(0);
  const len = text.length;
  let state = hashText(text);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < n; i++) {
    // xorshift PRNG, re-scrambled by the slop's characters as it goes
    state ^= state << 13; state ^= state >>> 17; state ^= state << 5;
    state = (state ^ Math.imul(text.charCodeAt(i % len), 2654435761)) >>> 0;
    const w = (state / 4294967296) * 2 - 1;
    // pink-noise filter (Paul Kellet): the deeper, softer hiss of a sound machine
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
    b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
    b6 = w * 0.115926;
  }
  return buf;
}

function scheduleChunk(ctx, dest, t, item) {
  const src = ctx.createBufferSource();
  src.buffer = slopToBuffer(ctx, item.text || '···');
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.setValueCurveAtTime(FADE_IN, t, FADE_SEC);
  g.gain.setValueCurveAtTime(FADE_OUT, t + CHUNK_SEC - FADE_SEC, FADE_SEC);
  src.connect(g); g.connect(dest);
  src.start(t); src.stop(t + CHUNK_SEC);
  return t + CHUNK_SEC - FADE_SEC;
}

function scheduleChunks() {
  // keep two chunks queued ahead so the hum never gaps
  while (nextChunkAt < audioCtx.currentTime + CHUNK_SEC * 2) {
    const item = audioQueue.shift() || nextItem();
    const t = Math.max(nextChunkAt, audioCtx.currentTime + 0.05);
    nextChunkAt = scheduleChunk(audioCtx, filterNode, t, item);
    setTimeout(() => {
      if (noiseOn) document.getElementById('noise-label').textContent = `now humming: ${item.tag}`;
    }, Math.max(0, (t + FADE_SEC - audioCtx.currentTime) * 1000));
  }
}

function toggleNoise() {
  const btn = document.getElementById('noise-btn');
  if (!noiseOn) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass'; filterNode.frequency.value = 2200;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      filterNode.connect(masterGain);
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 2);
    nextChunkAt = audioCtx.currentTime;
    scheduleChunks();
    schedulerId = setInterval(scheduleChunks, 500);
    noiseOn = true;
    document.getElementById('machine')?.classList.add('on');
    btn.classList.add('on');
    btn.innerHTML = '&#9646;&#9646;&nbsp;&nbsp;slop noise';
  } else {
    noiseOn = false;
    document.getElementById('machine')?.classList.remove('on');
    clearInterval(schedulerId);
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
    btn.classList.remove('on');
    btn.innerHTML = '&#9654;&nbsp;&nbsp;slop noise';
    document.getElementById('noise-label').textContent = 'turn the slop into white noise';
  }
}
</script>
